[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gencf"
version = "0.1.0"
description = "A package to determine nonzero crystal field parameters"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Li Hong Liu"}
]
keywords = ["crystal-field", "quantum"]
dependencies = [
    "numpy>=1.20.0",
    "sympy>=1.14.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Quantum-Integration-Laboratory/gencf"
Repository = "https://github.com/Quantum-Integration-Laboratory/gencf.git"
Issues = "https://github.com/Quantum-Integration-Laboratory/gencf/issues"

[tool.setuptools]
packages = ["gencf"]
